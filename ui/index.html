<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goal Digger — Camel Brown</title>
  <link rel="stylesheet" href="styles/aomi-tokens.css" />
  <link rel="stylesheet" href="styles/goaldigger.css" />
  <link rel="stylesheet" href="styles/theme-camel.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="module">
  import * as LucideReact from "https://esm.sh/lucide-react@0.383.0";
  window.LucideReact = LucideReact;
</script>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

  <!-- swap in the Camel Brown / Zelda brand lockup before components mount -->
  <script src="src/brand-camel.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/components.jsx"></script>
  <script type="text/babel" src="src/views.jsx"></script>

  <script type="text/babel">
    const { useState } = React;
    const G = window.GD;

    function App() {
      const [active, setActive] = useState("board");
      const [openId, setOpenId] = useState(null);
      const [trade, setTrade] = useState(null);

      const openMatch = (id) => { setOpenId(id); };
      const match = openId ? window.MATCHES.find((m) => m.id === openId) : null;
      const placeBet = (ctx) => setTrade(ctx);

      let center;
      if (active === "board") {
        center = <><G.Board onOpen={openMatch} /><G.EdgesFeed onPlaceBet={placeBet} onOpen={openMatch} /></>;
      } else if (active === "edges") {
        center = <G.EdgesFeed onPlaceBet={placeBet} onOpen={openMatch} />;
      } else if (active === "mybets") {
        center = <G.MyBets onPlaceBet={placeBet} />;
      } else {
        center = <G.LiveView onOpen={openMatch} />;
      }

      return (
        <div className="app">
          <G.LeftRail active={active} setActive={setActive} />
          <main className="center">{center}</main>
          <G.RightRail onOpenMatch={openMatch} />

          {match && (
            <G.MatchDetail m={match} onClose={() => setOpenId(null)} onPlaceBet={placeBet} />
          )}
          {trade && (
            <G.TradeModal ctx={trade} onClose={() => setTrade(null)} />
          )}
        </div>
      );
    }

    (async () => {
      const root = ReactDOM.createRoot(document.getElementById("root"));
      const draw = () => root.render(<App />);
      draw(); // instant render with bundled data
      // upgrade to real Rust-engine numbers when served by goal-digger-server;
      // stays on bundled mock when opened as a bare file (fetch just fails).
      if (window.loadLiveBoard) {
        try { if (await window.loadLiveBoard()) draw(); } catch (e) {}
      }
    })();
  </script>
</body>
</html>
