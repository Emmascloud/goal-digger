          expected_goals_away: la,
          heat,
          heatMax: maxCell,
          peak,
          top_scorelines,
          live: true,
        };
      }

      // Fetch /api/board (same-origin when served by goal-digger-server). On success,
      // rebuilds MATCHES + EDGES from real engine output and updates the window globals.
      // On any failure, the mock data already in place stays — the UI never breaks.
      // Build a board match object from a live /api/live-board entry (a real WC fixture
      // priced by the engine, with live score + lineup-derived adjustments). No per-match
      // Polymarket crowd price exists for group games, so crowd is shown as "—" and the
      // value-vs-crowd story lives in the Edges feed (real outright prices).
      function deriveFromLive(e) {
        const lh = e.lambda_home,
          la = e.lambda_away;
        const g = jointGrid(lh, la, 10);
        const heat = [];
        let peak = { h: 0, a: 0, p: 0 },
          maxCell = 0;
        for (let h = 0; h <= 5; h++) {
          const row = [];
          for (let a = 0; a <= 5; a++) {
            const p = g[h][a];
            row.push(p);
            if (p > maxCell) maxCell = p;
            if (p > peak.p) peak = { h, a, p };
          }
          heat.push(row);
        }
        const model = {
          home: e.p_home_win,
          draw: e.p_draw,
          away: e.p_away_win,
        };
        // real Polymarket 3-way prices when the match market exists, else "—"
        const crowd = e.crowd
          ? { home: e.crowd.home, draw: e.crowd.draw, away: e.crowd.away }
          : { home: null, draw: null, away: null };
        const edge = e.edge
          ? { home: e.edge.home, draw: e.edge.draw, away: e.edge.away }
          : { home: 0, draw: 0, away: 0 };
        // best = biggest positive edge if we have a market, else highest model
        const rank = e.edge ? edge : model;
        const best = ["home", "draw", "away"].reduce(
          (b, k) => (rank[k] > rank[b] ? k : b),
          "home",
        );

        const sc = e.score || {};
        const liveStatuses = ["1H", "2H", "HT", "ET", "BT", "P", "LIVE"];
        const isLive = liveStatuses.includes(e.status);
        const sh = sc.home ?? 0,
          sa = sc.away ?? 0;
        let kickoff;
        if (e.status === "FT") kickoff = `FT · ${sh}-${sa}`;
        else if (isLive)
          kickoff = `${e.elapsed ? e.elapsed + "'" : "LIVE"} · ${sh}-${sa}`;
        else {
          const d = new Date(e.kickoff);
          kickoff = isNaN(d)
            ? "Upcoming"
            : d.toLocaleString("en-US", {
                weekday: "short",
                hour: "2-digit",
                minute: "2-digit",
              });
        }
        const adjustments = (e.adjustments || []).map((a) => ({
          team: a.team,
          dir: /not in starting XI/.test(a.reason) ? "down" : "flat",
          reason: a.reason,
        }));

        return {
          id: e.id,
          fixture_id: e.fixture_id,
          comp: e.comp,
          kickoff,
          soon: e.status === "NS",
          live: isLive,
          status: e.status,
          score: sc,
          venue: e.venue,
          home: e.home,
          away: e.away,
          crowd,
          model,
          edge,
          best,
          sims: 50000,
          p_over_2_5: e.p_over_2_5,
          p_btts: e.p_btts,
          p_home_advance: e.p_home_advance,
          expected_goals_home: lh,
          expected_goals_away: la,
          heat,
          heatMax: maxCell,
          peak,
          top_scorelines: (e.top_scorelines || []).slice(0, 5),
          adjustments,
        };
      }

      async function loadLiveBoard() {
        // Real tournament board only (live fixtures + scores + Polymarket prices).
        // Empty snapshot (server still warming) or no server => return false; the bundled
        // mock already on screen stays, and the bootstrap retries until the snapshot is ready.
        try {
          const res = await fetch("/api/live-board", { cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            const live = (data.matches || []).map(deriveFromLive);
            if (live.length) {
              Object.assign(window, {
                MATCHES: live,
                EDGES: buildEdges(live),
                GD_LIVE: true,
                __GD_BOARD__: data,
              });
              return true;
            }
          }
        } catch (e) {
          /* fall through */
        }
        Object.assign(window, { GD_LIVE: false });
        return false;
      }

      // SLUG_MAP team name → RAW_MATCHES display name where they differ.
      const SLUG_NAME_OVERRIDES = { USA: "United States" };

      // Fetch /api/prices — live Polymarket outright winner prices for all fixture
      // teams. On success, patches OUTRIGHTS crowd prices and adds market_price to
      // CHAMPIONSHIP entries, then rebuilds EDGES so the EdgesFeed shows real gaps.
      // On any failure, hardcoded values stay — the UI never breaks.
      async function loadLivePrices() {
        try {
          const res = await fetch("/api/prices", { cache: "no-store" });
          if (!res.ok) throw new Error("prices " + res.status);
          const data = await res.json();

          const prevPrices = window.__GD_LIVE_PRICES || {};
          const byTeam = {};
          const livePrices = {};
          (data.outrights || []).forEach((o) => {
            byTeam[o.team] = o.market_price;
            livePrices[o.team] = o.market_price;
          });
          // Add match-name aliases so MatchCard lookups by m.home.name work.
          Object.entries(SLUG_NAME_OVERRIDES).forEach(([slug, matchName]) => {
            if (livePrices[slug] != null)
              livePrices[matchName] = livePrices[slug];
          });

          // Detect price moves; noise floor 0.0005 filters rounding drift.
          const moves = {};
          Object.entries(livePrices).forEach(([team, price]) => {
            const prev = prevPrices[team];
            if (prev != null && Math.abs(price - prev) > 0.0005)
              moves[team] = {
                dir: price > prev ? "up" : "down",
                from: prev,
                to: price,
              };
          });

          OUTRIGHTS.forEach((o) => {
            if (byTeam[o.team] != null) o.crowd = byTeam[o.team];
          });
          CHAMPIONSHIP.forEach((c) => {
            if (byTeam[c.team] != null) c.market_price = byTeam[c.team];
          });
          const liveEdges = buildEdges(window.MATCHES || MATCHES);

          Object.assign(window, {
            OUTRIGHTS,
            CHAMPIONSHIP,
            EDGES: liveEdges,
            GD_PRICES_LIVE: true,
            __GD_LIVE_PRICES: livePrices,
            __GD_PRICE_MOVES: moves,
            __GD_PRICES_UPDATED_AT: Date.now(),
          });

          // Auto-clear move indicators after the flash animation finishes (3.5s).
          if (Object.keys(moves).length > 0)
            setTimeout(() => {
              window.__GD_PRICE_MOVES = {};
            }, 3500);

          return true;
        } catch (e) {
          Object.assign(window, { GD_PRICES_LIVE: false });
          return false;
        }
      }

      // Poll /api/prices every intervalMs and call onUpdate() whenever a fetch
      // succeeds. Returns the interval ID so the caller can cancel if needed.
      function startPricePolling(onUpdate, intervalMs = 20000) {
        return setInterval(async () => {
          const updated = await loadLivePrices();
          if (updated) onUpdate();
        }, intervalMs);
      }

      const fmtPct = (x, dp = 0) =>
        x == null || isNaN(x) ? "—" : (x * 100).toFixed(dp) + "%";
      const fmtPrice = (x) => (x == null || isNaN(x) ? "—" : x.toFixed(3));
      const fmtPts = (x) => (x >= 0 ? "+" : "−") + Math.abs(x * 100).toFixed(1);
      const fmtUSD = (x) =>
        "$" +
        x.toLocaleString("en-US", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });

      Object.assign(window, {
        WALLET,
        MATCHES,
        CHAMPIONSHIP,
        OUTRIGHTS,
        EDGES,
        MY_BETS,
        FLAGS,
        outcomeLabel,
        fmtPct,
        fmtPrice,
        fmtPts,
        fmtUSD,
        loadLiveBoard,
        loadLivePrices,
        startPricePolling,
        GD_LIVE: false,
        GD_PRICES_LIVE: false,
        __GD_LIVE_PRICES: {},
        __GD_PRICE_MOVES: {},
        __GD_PRICES_UPDATED_AT: null,
      });
    </script>

      const renderMarkdown = (text) => {
        const esc = (s) =>
          s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const inl = (s) =>
          esc(s)
            .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
            .replace(/\*(.*?)\*/g, "<em>$1</em>")
            .replace(/`(.*?)`/g, "<code>$1</code>");
        const parseCells = (row) => {
          const parts = row.split("|");
          const s = parts[0].trim() === "" ? 1 : 0;
          const e =
            parts[parts.length - 1].trim() === ""
              ? parts.length - 1
              : parts.length;
          return parts.slice(s, e);
        };
        const isSep = (r) => {
          const c = parseCells(r);
          return c.length > 0 && c.every((x) => /^\s*:?-+:?\s*$/.test(x));
        };

        const lines = text.split("\n");
        const out = [];
        let i = 0;

        while (i < lines.length) {
          const line = lines[i];

          // Fenced code block
          if (line.trimStart().startsWith("```")) {
            const fence = [];
            i++;
            while (
              i < lines.length &&
              !lines[i].trimStart().startsWith("```")
            ) {
              fence.push(esc(lines[i]));
              i++;
            }
            out.push(
              `<pre class="md-pre"><code>${fence.join("\n")}</code></pre>`,
            );
            i++;
            continue;
          }

          // Headings
          if (/^### /.test(line)) {
            out.push(`<h3 class="md-h3">${inl(line.slice(4))}</h3>`);
            i++;
            continue;
          }
          if (/^## /.test(line)) {
            out.push(`<h2 class="md-h2">${inl(line.slice(3))}</h2>`);
            i++;
            continue;
          }
          if (/^# /.test(line)) {
            out.push(`<h1 class="md-h1">${inl(line.slice(2))}</h1>`);
            i++;
            continue;
          }

          // HR (must be before table since --- is a table separator too)
          if (/^-{3,}\s*$/.test(line.trim())) {
            out.push('<hr class="md-hr">');
            i++;
            continue;
          }

          // Table
          if (line.trimStart().startsWith("|")) {
            const rows = [];
            while (i < lines.length && lines[i].trimStart().startsWith("|")) {
              rows.push(lines[i]);
              i++;
            }
            const hasSep = rows.some(isSep);
            const dataRows = rows.filter((r) => !isSep(r));
            if (dataRows.length) {
              out.push('<div class="md-table-wrap"><table class="md-table">');
              dataRows.forEach((row, ri) => {
                const cells = parseCells(row);
                const tag = hasSep && ri === 0 ? "th" : "td";
                out.push(
                  "<tr>" +
                    cells
                      .map((c) => `<${tag}>${inl(c.trim())}</${tag}>`)
                      .join("") +
                    "</tr>",
                );
              });
              out.push("</table></div>");
            }
            continue;
          }

          // Blockquote
          if (/^> /.test(line)) {
            const bqs = [];
            while (i < lines.length && /^> /.test(lines[i])) {
              bqs.push(inl(lines[i].slice(2)));
              i++;
            }
            out.push(
              `<blockquote class="md-bq">${bqs.join("<br>")}</blockquote>`,
            );
            continue;
          }

          // Unordered list
          if (/^[-*] /.test(line)) {
            out.push('<ul class="md-ul">');
            while (i < lines.length && /^[-*] /.test(lines[i])) {
              out.push(`<li>${inl(lines[i].slice(2))}</li>`);
              i++;
            }
            out.push("</ul>");
            continue;
          }

          // Empty line → small gap
          if (line.trim() === "") {
            out.push('<div class="md-gap"></div>');
            i++;
            continue;
          }

          // Paragraph
          out.push(`<p class="md-p">${inl(line)}</p>`);
          i++;
        }

        return { __html: out.join("") };
      };

          setChatHistory(updatedHistory);

            { role: "user", content: q },

              ...updatedHistory,

                </div>
                <div className="bc">{b.price.toFixed(3)}</div>
                <div className="bc">{b.shares.toFixed(1)}</div>
                <div className="bc">{window.fmtUSD(b.stake)}</div>
                <span className={`bet-status ${b.status}`}>

                </span>
              </div>
            ))}
          </div>
        </div>
      );

      // Scrolling live odds ticker — shown at the top of the Live page.
      const PriceTicker = () => {
        const lp = window.__GD_LIVE_PRICES || {};
        const mv = window.__GD_PRICE_MOVES || {};
        const entries = Object.entries(lp).filter(
          ([t]) => !Object.values({ "United States": "USA" }).includes(t),
        );
        if (!entries.length || !window.GD_PRICES_LIVE) return null;

        // Build a code map from all matches for flag display.
        const codeMap = {};
        (window.MATCHES || []).forEach((m) => {
          codeMap[m.home.name] = m.home.code;
          codeMap[m.away.name] = m.away.code;
        });
        // SLUG_MAP name → match display name for code resolution.
        const SLUG_NAME = { USA: "United States" };
        entries.forEach(([t]) => {
          if (SLUG_NAME[t]) codeMap[t] = codeMap[SLUG_NAME[t]];
        });

        // Duplicate entries for seamless infinite scroll.
        const items = [...entries, ...entries];

        return (
          <div className="price-ticker-wrap">
            <span className="ticker-label">LIVE ODDS</span>
            <div className="price-ticker">
              {items.map(([team, price], i) => {
                const move = mv[team];
                const code = codeMap[team];
                return (
                  <span
                    key={i}
                    className={
                      "ticker-item" + (move ? " ticker-flash-" + move.dir : "")
                    }
                  >
                    {code && <window.GD.Flag code={code} w={14} h={10} />}
                    <span className="ticker-name">{team}</span>
                    <span
                      className={
                        "ticker-price mono" +
                        (move ? (move.dir === "up" ? " neg" : " pos") : "")
                      }
                    >
                      {move && (move.dir === "up" ? "▲ " : "▼ ")}
                      {window.fmtPrice(price)}
                    </span>
                  </span>
                );
              })}
            </div>
          </div>
        );
      };

      const LiveView = ({ onOpen }) => {
        const [, setTick] = React.useState(0);
        React.useEffect(() => {
          const id = setInterval(() => setTick((t) => t + 1), 1000);
          return () => clearInterval(id);
        }, []);

        const live = window.MATCHES.filter((m) => m.soon);
        const updatedAt = window.__GD_PRICES_UPDATED_AT;
        const secSince = updatedAt
          ? Math.floor((Date.now() - updatedAt) / 1000)
          : null;
        const ageLabel =
          secSince == null
            ? ""
            : secSince < 5
              ? " · just updated"
              : ` · odds ${secSince}s ago`;

        return (
          <div className="block">
            <div className="section-head">
              <h2 className="section-title serif">Live</h2>
              <div className="section-meta">
                <span className="live-dot" style={{ position: "static" }} />
                {live.length} kicking off soon
                {window.GD_PRICES_LIVE && (
                  <span className="prices-age">{ageLabel}</span>
                )}
              </div>
            </div>
            <PriceTicker />
            <p className="section-sub">
              Matches starting within the hour. The model re-runs as line-ups
              confirm and prices move.
            </p>
            <div className="board">
              {live.map((m) => (
                <window.GD.MatchCard key={m.id} m={m} onOpen={onOpen} />
              ))}
            </div>
            {live.length === 0 && (
              <div className="empty">
                Quiet for now. The board is your best view until kickoff.
              </div>
            )}
          </div>
        );
      };

      window.GD = Object.assign(window.GD || {}, {
        TradeModal,
        RightRail,
        MyBets,
        LiveView,
      });

      function policyOutcomeLabel(match, outcome) {
        if (outcome === "home") return match.home.name + " win";
        if (outcome === "away") return match.away.name + " win";
        return "Draw";
      }

      // ---- stub POST /api/policies ----
      async function apiCreatePolicy(payload) {
        try {
          const res = await fetch("/api/policies", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (res.ok) return await res.json();
        } catch (_) {}
        return {
          id: "pol_" + Math.random().toString(36).slice(2, 8),
          status: "watching",
        };
      }

      // ---- stub GET /api/policies ----
      async function apiFetchPolicies() {
        try {
          const res = await fetch("/api/policies", { cache: "no-store" });
          if (res.ok) return await res.json();
        } catch (_) {}
        return null;
      }

      // ---- Policy polling ----
      function startPolicyPolling(
        getPolicies,
        setPolicies,
        onTriggered,
        intervalMs = 8000,
      ) {
        return setInterval(async () => {
          const data = await apiFetchPolicies();
          if (!data) return;
          const list = Array.isArray(data) ? data : data.policies || [];
          setPolicies((prev) => {
            const next = list.map((remote) => {
              const local = prev.find((p) => p.id === remote.id) || {};
              return { ...local, ...remote };
            });
            next.forEach((p) => {
              const was = prev.find((q) => q.id === p.id);
              if (
                p.status === "triggered" &&
                was &&
                was.status === "watching"
              ) {
                onTriggered(p);
              }
            });
            return next;
          });
        }, intervalMs);
      }

          policy.modelProb != null
            ? policy.modelProb
            : (match.model[policy.outcome] ?? 0.5);

        const elapsed =
          policy.triggerElapsed || policy._simulateElapsed || "66";

        const tradeCtx = {
          label:
            outcomeLabel + " · " + match.home.code + " v " + match.away.code,

          price: crowdPrice,
          stake: policy.stake,
          model: modelProb,
          edge: edgePts,

        const selectedMatch = window.MATCHES.find((m) => m.id === matchId);

        React.useEffect(() => {

        const stakeNum = parseFloat(stake);
        const valid =
          selectedMatch &&
          outcome &&
          playerName &&
          triggerType &&
          !isNaN(stakeNum) &&
          stakeNum > 0;

        const handleCreate = async () => {
          if (!valid) return;
          setBusy(true);
          setErr(null);
          try {
            const result = await apiCreatePolicy({
              stake: stakeNum,
              matchId,
              outcome,
              triggerType,
              playerName,
            });
            onCreated({
              id: result.id,
              status: result.status || "watching",
              stake: stakeNum,
              matchId,
              outcome,
              triggerType,
              playerName,
              createdAt: Date.now(),
            });
            setPlayer("");
            setOutcome("home");

            setErr("Failed to create policy. Try again.");

        return (

                {window.MATCHES.map((m) => (

      // ============================================================
      //  PoliciesView — the full center view
      // ============================================================
      const PoliciesView = ({ onPlaceBet }) => {
        const [policies, setPolicies] = React.useState([]);
        const [pendingApproval, setPending] = React.useState(null);

        React.useEffect(() => {
          apiFetchPolicies().then((data) => {
            if (!data) return;
            const list = Array.isArray(data) ? data : data.policies || [];
            if (list.length) setPolicies(list);
          });

          const id = startPolicyPolling(
            () => policies,
            setPolicies,
            (triggered) => setPending((prev) => (prev ? prev : triggered)),
          );
          return () => clearInterval(id);
        }, []);

        const handleCreated = (p) => setPolicies((prev) => [p, ...prev]);

        const handleSimulate = (policyId) => {
          setPolicies((prev) =>
            prev.map((p) => {
              if (p.id !== policyId) return p;
              const sim = {
                ...p,
                status: "triggered",
                _simulateElapsed: String(55 + Math.floor(Math.random() * 30)),
              };
              setPending((prev2) => (prev2 ? prev2 : sim));
              return sim;
            }),
          );
        };

        const handleRemove = (policyId) =>
          setPolicies((prev) => prev.filter((p) => p.id !== policyId));

        const handleApprove = (tradeCtx) => {
          setPolicies((prev) =>
            prev.map((p) =>
              p.id === (pendingApproval && pendingApproval.id)
                ? { ...p, status: "placed" }
                : p,
            ),
          );
          setPending(null);
          onPlaceBet(tradeCtx);
        };

        const handleDismiss = () => setPending(null);

        const watchingCount = policies.filter(
          (p) => p.status === "watching",
        ).length;

        return (
          <div className="block policies-view">
            <div className="section-head">
              <h2 className="section-title serif">Policies</h2>
              <div className="section-meta">
                <span className="mono">{watchingCount}</span> watching
              </div>
            </div>
            <p className="section-sub">

              you approve the bet — nothing signs without you.

              <div className="policies-create-col">
                <CreatePolicyPanel onCreated={handleCreated} />
              </div>
              <div className="policies-list-col">
                <div className="panel-label" style={{ marginBottom: 16 }}>
                  Active policies
                </div>
                <ActivePoliciesList
                  policies={policies}
                  onSimulate={handleSimulate}
                  onRemove={handleRemove}
                />
              </div>
            </div>

            {pendingApproval && (
              <PolicyApprovalModal
                policy={pendingApproval}
                onApprove={handleApprove}
                onDismiss={handleDismiss}
              />
            )}
          </div>
        );
      };

      window.GD = Object.assign(window.GD || {}, { PoliciesView });
    </script>
    <script type="text/babel">
      const { useState } = React;
      const G = window.GD;

      function App() {
        const [active, setActive] = useState("board");
        const [openId, setOpenId] = useState(null);
        const [trade, setTrade] = useState(null);

        const openMatch = (id) => {
          setOpenId(id);
        };
        const match = openId
          ? window.MATCHES.find((m) => m.id === openId)
          : null;
        const placeBet = (ctx) => setTrade(ctx);

        let center;
        if (active === "board") {
          center = (
            <>
              <G.Board onOpen={openMatch} />
              <G.EdgesFeed onPlaceBet={placeBet} onOpen={openMatch} />
            </>
          );
        } else if (active === "edges") {
          center = <G.EdgesFeed onPlaceBet={placeBet} onOpen={openMatch} />;
        } else if (active === "mybets") {
          center = <G.MyBets onPlaceBet={placeBet} />;
        } else if (active === "policies") {
          center = <G.PoliciesView onPlaceBet={placeBet} />;
        } else {
          center = <G.LiveView onOpen={openMatch} />;
        }

        return (
          <div className="app">
            <G.LeftRail active={active} setActive={setActive} />
            <main className="center">{center}</main>
            <G.RightRail onOpenMatch={openMatch} />

            {match && (
              <G.MatchDetail
                m={match}
                onClose={() => setOpenId(null)}
                onPlaceBet={placeBet}
              />
            )}
            {trade && (
              <G.TradeModal ctx={trade} onClose={() => setTrade(null)} />
            )}
          </div>
        );
      }

      (async () => {
        const root = ReactDOM.createRoot(document.getElementById("root"));
        const draw = () => root.render(<App />);
        draw(); // instant render with bundled data
        // upgrade to real Rust-engine numbers when served by goal-digger-server;
        // stays on bundled mock when opened as a bare file (fetch just fails).
        let boardLive = false;
        if (window.loadLiveBoard) {
          try {
            boardLive = await window.loadLiveBoard();
            if (boardLive) draw();
          } catch (e) {}
        }
        // if the server is still computing its first snapshot, keep retrying until live
        if (!boardLive && window.loadLiveBoard) {
          const retry = setInterval(async () => {
            try {
              if (await window.loadLiveBoard()) {
                draw();
                clearInterval(retry);
              }
            } catch (e) {}
          }, 15000);
        }
        if (window.loadLivePrices) {
          try {
            if (await window.loadLivePrices()) draw();
          } catch (e) {}
        }
        if (window.startPricePolling) {
          window.startPricePolling(draw);
        }
      })();
    </script>
  </body>
</html>
