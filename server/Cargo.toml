[package]
name = "goal-digger-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "goal-digger-server"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tiny_http = "0.12"
ureq = { version = "3.3.0", features = ["json"] }
